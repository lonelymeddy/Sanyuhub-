<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111318">
  <title>sanyuhub — Device Menu</title>
  <link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <style>
    :root {
      color-scheme: dark;
      --header: #111318;
      --sidebar: #1a1c23;
      --hover: #292b35;
      --line: #30323a;
      --text: #f5f5f7;
      --muted: #c8cad3;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #0d0e12; color: var(--text); overflow-x: clip; }
    button { font: inherit; }
    .app { width: min(100%, 440px); min-height: 100vh; margin: 0 auto; background: var(--sidebar); box-shadow: 0 0 40px #0005; }
    .header { height: 68px; display: flex; align-items: center; gap: 12px; padding: 0 16px; background: var(--header); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 100; }
    .logo { width: 40px; height: 40px; object-fit: contain; flex-shrink: 0; }
    .brand { font-size: 20px; font-weight: 750; letter-spacing: -.5px; }
    .menu-toggle { margin-left: auto; width: 42px; height: 42px; display: grid; place-items: center; border: 0; border-radius: 9px; background: transparent; color: white; cursor: pointer; }
    .menu-toggle:hover, .menu-toggle:focus-visible { background: var(--hover); outline: none; }
    .menu-toggle svg { width: 23px; height: 23px; }
    .sidebar { padding: 10px 8px 20px; background: linear-gradient(rgba(26, 28, 35, 0.88), rgba(26, 28, 35, 0.94)), url('/assets/homepage-hero.png'); background-position: center; background-size: cover; background-repeat: no-repeat; position: sticky; top: 68px; max-height: calc(100vh - 68px); overflow-y: auto; z-index: 90; }
    .category { border-radius: 9px; overflow: hidden; }
    .category-button { width: 100%; min-height: 48px; display: flex; align-items: center; gap: 13px; padding: 10px 12px; border: 0; border-radius: 9px; color: var(--text); background: transparent; text-align: left; cursor: pointer; }
    .category-button:hover, .category-button:focus-visible { background: var(--hover); outline: none; }
    .category-icon { width: 22px; height: 22px; flex: 0 0 22px; display: grid; place-items: center; color: #e7e7eb; }
    .category-icon svg { width: 21px; height: 21px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .category-name { flex: 1; font-size: 15px; font-weight: 520; }
    .toggle-symbol { width: 24px; height: 24px; display: grid; place-items: center; font-size: 23px; line-height: 1; font-weight: 350; }
    .devices { display: none; padding: 0 12px 8px 47px; }
    .category.open .devices { display: block; animation: reveal .16s ease-out; }
    a.category-button { text-decoration: none; }
    .category-button.selected { background: var(--hover); color: white; font-weight: 600; }
    .device { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 40px; padding: 8px 0 8px 12px; border: 0; border-left: 1px solid #555864; background: transparent; color: var(--muted); text-align: left; font-size: 14px; cursor: pointer; text-decoration: none; }
    .device-icon { width: 18px; height: 18px; flex: 0 0 18px; display: grid; place-items: center; color: inherit; }
    .device-icon svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .device:hover, .device:focus-visible { color: white; background: #ffffff08; outline: none; }
    .device.selected { color: white; }
    .workspace { padding: 24px 16px; border-top: 1px solid var(--line); background: #111318; min-height: 200px; }
    .workspace h2 { margin: 0 0 8px; font-size: 18px; }
    .workspace p { margin: 0; color: #a1a4b0; font-size: 14px; line-height: 1.5; }
    .status { margin-top: 18px; padding: 12px; border: 1px solid #30323a; border-radius: 10px; color: #c8cad3; font-size: 13px; }
    @keyframes reveal { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }

    button, .category-button, .device, .menu-toggle {
      transition: transform 150ms cubic-bezier(0.2, 0, 0, 1), background-color 150ms ease, color 150ms ease;
      will-change: transform;
      -webkit-tap-highlight-color: transparent;
    }
    button:not([disabled]):active, button:not([disabled]).is-pressed,
    .category-button:active, .category-button.is-pressed,
    .device:active, .device.is-pressed,
    .menu-toggle:active, .menu-toggle.is-pressed {
      transform: scale(0.96) !important;
      transition-duration: 120ms;
    }

  </style>
</head>
<body>
  <main class="app">
    <header class="header">
      <img class="logo" src="/assets/sanyuhub-logo.png" alt="sanyuhub logo" width="40" height="40">
      <div class="brand">sanyuhub</div>
      <button class="menu-toggle" id="menuToggle" aria-label="Toggle sidebar" aria-expanded="true" aria-controls="sidebar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </header>

    <nav class="sidebar" id="sidebar" aria-label="Devices">
      <section class="category" data-category="Home">
        <button class="category-button" data-home="true">
          <span class="category-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></span>
          <span class="category-name">Home</span>
        </button>
      </section>
      <section class="category" data-category="Mobile">
        <button class="category-button" aria-expanded="false">
          <span class="category-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg></span>
          <span class="category-name">Mobile</span><span class="toggle-symbol" aria-hidden="true">+</span>
        </button>
        <div class="devices">
          <button class="device"><span class="device-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg></span>Website</button>
        </div>
      </section>
      <section class="category" data-category="Android">
        <button class="category-button" aria-expanded="false">
          <span class="category-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 7h6M10 17h4"/></svg></span>
          <span class="category-name">Android</span><span class="toggle-symbol" aria-hidden="true">+</span>
        </button>
        <div class="devices"><button class="device">Android Phones</button><button class="device">Android Tablets</button></div>
      </section>
      <section class="category" data-category="iOS">
        <button class="category-button" aria-expanded="false">
          <span class="category-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="3"/><path d="M10 17h4"/></svg></span>
          <span class="category-name">iOS</span><span class="toggle-symbol" aria-hidden="true">+</span>
        </button>
        <div class="devices"><button class="device">iPhone</button><button class="device">iPad</button></div>
      </section>
      <section class="category" data-category="Desktop">
        <button class="category-button" aria-expanded="false">
          <span class="category-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13" rx="1.5"/><path d="M8 21h8M12 17v4"/></svg></span>
          <span class="category-name">Desktop</span><span class="toggle-symbol" aria-hidden="true">+</span>
        </button>
        <div class="devices"><button class="device">Windows</button><button class="device">macOS</button><button class="device">Linux</button><button class="device">Chromebook</button></div>
      </section>
      <section class="category" data-category="Smart TV">
        <button class="category-button" aria-expanded="false">
          <span class="category-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="13" rx="1.5"/><path d="m8 2 4 3 4-3M9 21h6"/></svg></span>
          <span class="category-name">Smart TV</span><span class="toggle-symbol" aria-hidden="true">+</span>
        </button>
        <div class="devices"><button class="device">Samsung Smart TV</button><button class="device">LG Smart TV</button><button class="device">Android TV</button><button class="device">Google TV</button><button class="device">Hisense Smart TV</button></div>
      </section>
      <section class="category" data-category="Gaming Consoles">
        <button class="category-button" aria-expanded="false">
          <span class="category-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6 9h12a4 4 0 0 1 3.8 5l-1 3a2 2 0 0 1-3.2 1l-3-2H9l-3 2a2 2 0 0 1-3.2-1l-1-3A4 4 0 0 1 6 9Z"/><path d="M7 11v4M5 13h4M16 12h.01M19 14h.01"/></svg></span>
          <span class="category-name">Gaming Consoles</span><span class="toggle-symbol" aria-hidden="true">+</span>
        </button>
        <div class="devices"><button class="device">PlayStation</button><button class="device">Xbox</button></div>
      </section>
      <section class="category" data-category="Streaming Devices">
        <button class="category-button" aria-expanded="false">
          <span class="category-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 8a12 12 0 0 1 16 0M7 11a8 8 0 0 1 10 0M10 14a4 4 0 0 1 4 0M12 18h.01"/></svg></span>
          <span class="category-name">Streaming Devices</span><span class="toggle-symbol" aria-hidden="true">+</span>
        </button>
        <div class="devices"><button class="device">Apple TV</button><button class="device">Amazon Fire TV</button><button class="device">Chromecast</button><button class="device">Roku</button></div>
      </section>
      <section class="category" data-category="Set-top Boxes">
        <button class="category-button" aria-expanded="false">
          <span class="category-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="11" rx="2"/><path d="M7 12h.01M11 12h.01M15 12h.01M19 12h.01"/></svg></span>
          <span class="category-name">Set-top Boxes</span><span class="toggle-symbol" aria-hidden="true">+</span>
        </button>
        <div class="devices"><button class="device">Android TV Boxes</button><button class="device">Compatible Cable Boxes</button></div>
      </section>
    </nav>

    <section class="workspace" aria-live="polite">
      <h2 id="workspaceTitle">sanyuhub</h2>
      <p id="workspaceText">Choose a device from the menu.</p>
      <div class="status" id="workspaceStatus">Selected device: None</div>
    </section>
  </main>

  <script>
    const menuToggle = document.getElementById('menuToggle');
    const sidebar = document.getElementById('sidebar');
    menuToggle.addEventListener('click', () => {
      const isVisible = !sidebar.hidden;
      sidebar.hidden = isVisible;
      menuToggle.setAttribute('aria-expanded', String(!isVisible));
    });

    document.querySelectorAll('.category-button').forEach(button => {
      button.addEventListener('click', () => {
        if (button.dataset.home === "true") {
          document.querySelectorAll('.device.selected, .category-button.selected').forEach(el => el.classList.remove('selected'));
          button.classList.add('selected');
          document.getElementById('workspaceTitle').textContent = 'sanyuhub';
          document.getElementById('workspaceText').textContent = 'Choose a device from the menu.';
          document.getElementById('workspaceStatus').textContent = 'Selected device: None';
          return;
        }
        const toggleSymbol = button.querySelector('.toggle-symbol');
        if (!toggleSymbol) return;
        const category = button.closest('.category');
        const isOpen = category.classList.toggle('open');
        button.setAttribute('aria-expanded', String(isOpen));
        toggleSymbol.textContent = isOpen ? '−' : '+';
      });
    });

    document.querySelectorAll('.device').forEach(button => {
      button.addEventListener('click', () => {
        document.querySelectorAll('.device.selected, .category-button.selected').forEach(el => el.classList.remove('selected'));
        button.classList.add('selected');
        const category = button.closest('.category').dataset.category;
        const text = button.textContent.trim();
        document.getElementById('workspaceTitle').textContent = text;
        document.getElementById('workspaceText').textContent = 'You selected ' + text + ' under ' + category + '.';
        document.getElementById('workspaceStatus').textContent = 'Selected device: ' + text;
      });
    });
  </script>
</body>
</html>
